name: Corriger mousse voitures
on:
  push:
    branches: [main]
    paths: [.github/workflows/fix-foam-car-visibility.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Corriger la mousse du car wash
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/components/CarWashScene.tsx')
          s = p.read_text(encoding='utf-8')

          s = s.replace('''    const soapMat = new THREE.MeshStandardMaterial({\n      color: 0xffffff,\n      transparent: true,\n      opacity: 0.9,\n      roughness: 0.45,\n    });\n    const soapGeo = new THREE.IcosahedronGeometry(0.22, 0);''','''    const soapMat = new THREE.MeshStandardMaterial({\n      color: 0xf5fbff,\n      transparent: true,\n      opacity: 0.48,\n      roughness: 0.35,\n      depthWrite: false,\n    });\n    const soapGeo = new THREE.IcosahedronGeometry(0.13, 0);''',1)

          s = s.replace('''      for (let i = 0; i < 26; i++) {\n        const b = new THREE.Mesh(soapGeo, soapMat);\n        const a = Math.random() * Math.PI * 2;\n        b.position.set(\n          (Math.random() - 0.5) * 3.4,\n          0.25 + Math.random() * 0.95,\n          Math.cos(a) * (0.55 + Math.random() * 0.35),\n        );''','''      for (let i = 0; i < 14; i++) {\n        const b = new THREE.Mesh(soapGeo, soapMat);\n        const a = Math.random() * Math.PI * 2;\n        b.position.set(\n          (Math.random() - 0.5) * 2.5,\n          0.28 + Math.random() * 0.65,\n          Math.cos(a) * (0.42 + Math.random() * 0.22),\n        );''',1)

          old = '''        if (e.soap) {\n          const prog = 1 - dirtiness; // 0 → 1 dans le tunnel\n          const inTunnel = e.d > WASH_D0 && e.d < WASH_D1;\n          const cover = inTunnel ? Math.sin(Math.PI * Math.min(prog * 1.15, 1)) : 0;\n          e.soap.visible = cover > 0.02;\n          e.soap.children.forEach((b, j) => {\n            const s = (b.userData['s'] as number) ?? 1;\n            b.scale.setScalar(Math.max(cover * s * (0.8 + Math.sin(t * 5 + j) * 0.12), 0.001));\n            b.rotation.y += dt * 1.5;\n          });\n        }'''
          new = '''        if (e.soap) {\n          /* La mousse n'apparait que dans la zone savon. Elle reste légère et\n             ne masque jamais entièrement le modèle Kenney. */\n          const washSpan = WASH_D1 - WASH_D0;\n          const soapStart = WASH_D0 + washSpan * 0.12;\n          const soapEnd = WASH_D0 + washSpan * 0.62;\n          const inSoapZone = e.d > soapStart && e.d < soapEnd;\n          const soapProg = THREE.MathUtils.clamp((e.d - soapStart) / Math.max(soapEnd - soapStart, 0.001), 0, 1);\n          const cover = inSoapZone ? Math.sin(Math.PI * soapProg) * 0.62 : 0;\n          e.soap.visible = inSoapZone && cover > 0.025;\n          e.soap.children.forEach((b, j) => {\n            const s = (b.userData['s'] as number) ?? 1;\n            b.scale.setScalar(Math.max(cover * s * (0.72 + Math.sin(t * 5 + j) * 0.08), 0.001));\n            b.rotation.y += dt * 1.2;\n          });\n        }'''
          if old not in s:
            raise SystemExit('bloc animation mousse introuvable')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit
      - name: Enregistrer
        run: |
          rm -f .github/workflows/fix-foam-car-visibility.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/CarWashScene.tsx .github/workflows/fix-foam-car-visibility.yml
          git commit -m "Corrige la mousse qui masquait les voitures"
          git push origin HEAD:main
