name: Build Latest Autonomous APK

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/android-latest.yml"
      - "src/**"
      - "mobile-app/**"
      - "package.json"
      - "bun.lock"
      - "capacitor.config.ts"
      - "vite.mobile.config.ts"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tikowikocity-latest-apk
  cancel-in-progress: true

jobs:
  build-latest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Integrate automatic city growth
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/components/CarWashScene.tsx')
          s = p.read_text()

          if 'installAutoCityGrowth' not in s:
              import_anchor = 'import { HOUSE_LEVELS, MAX_HOUSE_LEVEL, houseDef, totalCapacity } from "@/game/houses";\nimport { readLocalCity, saveLocalCity } from "@/game/save";'
              import_repl = 'import { HOUSE_LEVELS, MAX_HOUSE_LEVEL, houseDef, totalCapacity } from "@/game/houses";\nimport { installAutoCityGrowth } from "@/game/autoCityGrowth";\nimport { readLocalCity, saveLocalCity } from "@/game/save";'
              if import_anchor not in s:
                  raise SystemExit('Auto-city import anchor not found')
              s = s.replace(import_anchor, import_repl, 1)

              anchor = '''    let ti = 0;
    const spawnNetCar = (cx: number, cz: number) => {'''
              if anchor not in s:
                  raise SystemExit('Auto-city insertion anchor not found')
              call = '''    installAutoCityGrowth({
      scene,
      plan,
      tile: TILE,
      mainCx: MAIN_CX,
      mainCzStart: MAIN_CZ_START,
      getMoney: () => economyRef.current.money,
      isDisposed: () => disposed,
      makeHouse,
      renderPlan,
      renderHouses,
      renderDecor,
      onStageStart: (stage) => {
        toast.info(`🚧 Chantier : ${stage.label}`, {
          description: `Débloqué à ${stage.unlockMoney.toLocaleString("fr-FR")} € de prospérité.`,
        });
      },
      onStageComplete: (stage) => {
        logRef.current(
          makeEvent("build", `Ville automatique · ${stage.label}`, 0, economyRef.current.money),
        );
        toast.success(`🏗️ ${stage.label} terminé`, {
          description: "TikowikoCity s'agrandit automatiquement grâce à tes revenus.",
        });
      },
    });

'''
              s = s.replace(anchor, call + anchor, 1)
              p.write_text(s)

          Path('/tmp/CarWashScene.auto.tsx').write_text(p.read_text())
          PY

      - name: Check integrated TypeScript
        run: bunx tsc --noEmit

      - name: Prepare standalone source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/components/CarWashScene.tsx')
          s = p.read_text()
          s = s.replace('import { useServerFn } from "@tanstack/react-start";\n', '')
          p.write_text(s)
          PY

      - name: Bundle 3D assets from previous autonomous APK
        run: |
          set -euo pipefail
          PREVIOUS_APK="apk/TikowikoCity-latest.apk"
          test -s "$PREVIOUS_APK"

          extract_asset() {
            local filename="$1"
            local destination="$2"
            local entry
            entry="$(unzip -Z1 "$PREVIOUS_APK" | grep "/${filename}$" | head -n 1 || true)"
            if [ -z "$entry" ]; then
              echo "Asset ${filename} absent de l'APK autonome précédent"
              exit 1
            fi
            mkdir -p "$(dirname "$destination")"
            unzip -p "$PREVIOUS_APK" "$entry" > "$destination"
            test -s "$destination"
          }

          extract_asset "car-wash-models.json" "public/__l5e/assets-v1/63fd50ef-6f12-4785-b014-6ffd65421b9e/car-wash-models.json"
          extract_asset "tunnel.glb" "public/__l5e/assets-v1/9c5274f0-aa40-4b17-b9ec-59b98304032c/tunnel.glb"
          extract_asset "kenney-pack.glb" "public/__l5e/assets-v1/08f530e6-70ff-45a1-bd46-eaedca3a22fd/kenney-pack.glb"

      - name: Check standalone TypeScript
        run: bunx tsc --noEmit

      - name: Build mobile game
        run: bun run build:mobile

      - name: Create Android project
        run: |
          rm -rf android
          bunx cap add android
          bunx cap sync android

      - name: Build APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug

      - name: Upload latest APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TikowikoCity-latest-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish automatic city source and latest APK
        run: |
          set -euo pipefail
          mkdir -p apk
          cp /tmp/CarWashScene.auto.tsx src/components/CarWashScene.tsx
          cp android/app/build/outputs/apk/debug/app-debug.apk apk/TikowikoCity-latest.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/CarWashScene.tsx
          git add -f apk/TikowikoCity-latest.apk
          if git diff --cached --quiet; then
            echo "Source and latest APK unchanged"
            exit 0
          fi
          git commit -m "Ajoute ville automatique et publie APK [skip ci]"
          git reset --hard HEAD
          git clean -fd
          git pull --rebase origin main
          git push origin HEAD:main
