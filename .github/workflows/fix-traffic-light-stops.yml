name: Corriger arrêt aux feux rouges
on:
  push:
    branches: [main]
    paths: [.github/workflows/fix-traffic-light-stops.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Faire respecter les feux rouges
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/components/CarWashScene.tsx')
          s = p.read_text(encoding='utf-8')
          old = '''      netCars.forEach((e) => {
        if (!ctl.traffic) return;
        const step = dt * e.speed;
        const nt = e.t + step / TILE;

        // distance de sécurité avec la voiture devant, dans la même case
        const tooClose = netCars.some(
          (o) =>
            o !== e && o.cx === e.cx && o.cz === e.cz && o.t > e.t && o.t - e.t < 0.4,
        );
        if (tooClose) return;

        if (nt < 1) {
          e.t = nt;
        } else {
          const [dx, dz] = DIR_VEC[e.dirOut]!;
          const nx = e.cx + dx;
          const nz = e.cz + dz;
          const next = plan.get(nx, nz);
          if (!next) {
            // cul-de-sac : demi-tour sans quitter la chaussée
            e.dirIn = e.dirOut;
            e.dirOut = opposite(e.dirIn);
            e.t = 0;
          } else {
            const busy =
              netCars.filter((o) => o !== e && o.cx === nx && o.cz === nz).length >= 2;
            const red = next.light && axisOf(e.dirOut) !== greenAxis;
            if (busy || red) {
              e.t = 0.97;
              return;
            }
            e.cx = nx;
            e.cz = nz;
            e.dirIn = e.dirOut;
            e.t = Math.min(nt - 1, 0.5);
            const exits = plan.exitsFrom(nx, nz, e.dirIn);
            e.dirOut =
              exits.includes(e.dirIn) && Math.random() < 0.65
                ? e.dirIn
                : exits[Math.floor(Math.random() * exits.length)]!;
          }
        }

        e.wheels.forEach((w) => {
          w.rotation.x -= ((w.userData['spinSign'] as number) ?? 1) * (step / 0.35) * 2;
        });
      });'''
          new = '''      netCars.forEach((e) => {
        if (!ctl.traffic) return;
        const step = dt * e.speed;
        const rawNt = e.t + step / TILE;

        // distance de sécurité avec la voiture devant, dans la même case
        const tooClose = netCars.some(
          (o) =>
            o !== e && o.cx === e.cx && o.cz === e.cz && o.t > e.t && o.t - e.t < 0.4,
        );
        if (tooClose) return;

        /* Vraie ligne d'arrêt : on regarde le feu de la case que la voiture
           quitte ET celui de l'intersection qu'elle va emprunter. Ainsi un
           feu rouge posé sur une intersection ou juste avant est respecté. */
        const [sdx, sdz] = DIR_VEC[e.dirOut]!;
        const signalNext = plan.get(e.cx + sdx, e.cz + sdz);
        const signalHere = plan.get(e.cx, e.cz);
        const hasSignal = !!signalHere?.light || !!signalNext?.light;
        const redAtExit = hasSignal && axisOf(e.dirOut) !== greenAxis;
        const STOP_LINE_T = 0.82;

        // Au rouge on avance jusqu'à la ligne, jamais dans l'intersection.
        if (redAtExit && e.t >= STOP_LINE_T) return;
        const nt = redAtExit ? Math.min(rawNt, STOP_LINE_T) : rawNt;

        if (nt < 1) {
          const movedT = Math.max(nt - e.t, 0);
          e.t = nt;
          e.wheels.forEach((w) => {
            w.rotation.x -= ((w.userData['spinSign'] as number) ?? 1) * ((movedT * TILE) / 0.35) * 2;
          });
          return;
        }

        const [dx, dz] = DIR_VEC[e.dirOut]!;
        const nx = e.cx + dx;
        const nz = e.cz + dz;
        const next = plan.get(nx, nz);
        if (!next) {
          // cul-de-sac : demi-tour sans quitter la chaussée
          e.dirIn = e.dirOut;
          e.dirOut = opposite(e.dirIn);
          e.t = 0;
        } else {
          const busy =
            netCars.filter((o) => o !== e && o.cx === nx && o.cz === nz).length >= 2;
          /* Double sécurité au franchissement : si le feu devient rouge entre
             deux images, la voiture reste avant l'intersection. */
          const red = (!!signalHere?.light || !!next.light) && axisOf(e.dirOut) !== greenAxis;
          if (busy || red) {
            e.t = Math.min(e.t, STOP_LINE_T);
            return;
          }
          e.cx = nx;
          e.cz = nz;
          e.dirIn = e.dirOut;
          e.t = Math.min(nt - 1, 0.5);
          const exits = plan.exitsFrom(nx, nz, e.dirIn);
          e.dirOut =
            exits.includes(e.dirIn) && Math.random() < 0.65
              ? e.dirIn
              : exits[Math.floor(Math.random() * exits.length)]!;
        }

        e.wheels.forEach((w) => {
          w.rotation.x -= ((w.userData['spinSign'] as number) ?? 1) * (step / 0.35) * 2;
        });
      });'''
          if old not in s:
            raise SystemExit('Bloc trafic attendu introuvable')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit
      - name: Enregistrer
        run: |
          rm -f .github/workflows/fix-traffic-light-stops.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/CarWashScene.tsx .github/workflows/fix-traffic-light-stops.yml
          git commit -m "Fait respecter les feux rouges par les voitures"
          git pull --rebase origin main
          git push origin HEAD:main
