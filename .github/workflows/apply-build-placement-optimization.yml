name: Appliquer optimisation pose objets

on:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  optimize:
    if: github.event.issue.title == '[TIKOWIKO] Apply build placement optimization'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fluidifier la construction
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/components/CarWashScene.tsx')
          s = p.read_text(encoding='utf-8')

          old_flush = '''    /* Rendus à rafraîchir après une série d'actions. */
    const dirty = { plan: false, houses: false, decor: false };
    const flushRender = () => {
      if (dirty.plan) renderPlan();
      if (dirty.houses) renderHouses();
      if (dirty.decor) renderDecor();
      dirty.plan = dirty.houses = dirty.decor = false;
    };
'''
          new_flush = '''    /* Rendus à rafraîchir après une série d'actions.
       Pendant un glissement, les événements pointermove peuvent arriver bien
       plus vite que le GPU ne peut reconstruire la scène. On regroupe donc les
       reconstructions lourdes et on ne les exécute qu'à cadence maîtrisée. */
    const dirty = { plan: false, houses: false, decor: false };
    let buildRenderTimer = 0;
    let buildRenderFrame = 0;
    const coarsePointer = window.matchMedia?.("(pointer: coarse)").matches ?? false;
    const buildRenderDelay = coarsePointer ? 55 : 28;

    const flushRenderNow = () => {
      if (dirty.plan) renderPlan();
      if (dirty.houses) renderHouses();
      if (dirty.decor) renderDecor();
      dirty.plan = dirty.houses = dirty.decor = false;
    };

    const cancelScheduledBuildRender = () => {
      if (buildRenderTimer) window.clearTimeout(buildRenderTimer);
      if (buildRenderFrame) cancelAnimationFrame(buildRenderFrame);
      buildRenderTimer = 0;
      buildRenderFrame = 0;
    };

    const flushRender = () => {
      if (buildRenderTimer || buildRenderFrame) return;
      buildRenderTimer = window.setTimeout(() => {
        buildRenderTimer = 0;
        buildRenderFrame = requestAnimationFrame(() => {
          buildRenderFrame = 0;
          flushRenderNow();
        });
      }, buildRenderDelay);
    };

    const flushRenderImmediate = () => {
      cancelScheduledBuildRender();
      flushRenderNow();
    };
'''
          if old_flush not in s:
            raise SystemExit('bloc flushRender introuvable')
          s = s.replace(old_flush, new_flush, 1)

          old_up = '''      if (isDragTool(tool)) {
        if (c) traceRoadTo(c);
        roadDragLast = null;
        flushRender();
        return;
      }
'''
          new_up = '''      if (isDragTool(tool)) {
        if (c) traceRoadTo(c);
        roadDragLast = null;
        flushRenderImmediate();
        return;
      }
'''
          if old_up not in s:
            raise SystemExit('bloc pointerup introuvable')
          s = s.replace(old_up, new_up, 1)

          old_cancel = '''    const onPointerCancel = (ev: PointerEvent) => {
      if (downAt?.id === ev.pointerId) downAt = null;
      roadDragLast = null;
      releasePointer(ev);
    };
'''
          new_cancel = '''    const onPointerCancel = (ev: PointerEvent) => {
      if (downAt?.id === ev.pointerId) downAt = null;
      roadDragLast = null;
      releasePointer(ev);
      flushRenderImmediate();
    };
'''
          if old_cancel not in s:
            raise SystemExit('bloc pointercancel introuvable')
          s = s.replace(old_cancel, new_cancel, 1)

          old_build = '''    buildApplyRef.current = (on: boolean) => {
      gridHelper.visible = on;
      controls.enabled = !on;
      renderer.domElement.style.touchAction = on ? "none" : "auto";
      if (!on) {
        ghost.visible = false;
        downAt = null;
        roadDragLast = null;
      }
    };
'''
          new_build = '''    const normalPixelRatio = Math.min(window.devicePixelRatio, coarsePointer ? 1.25 : 2);
    buildApplyRef.current = (on: boolean) => {
      gridHelper.visible = on;
      controls.enabled = !on;
      renderer.domElement.style.touchAction = on ? "none" : "auto";
      renderer.shadowMap.autoUpdate = !on;
      renderer.setPixelRatio(on ? Math.min(normalPixelRatio, 1) : normalPixelRatio);
      renderer.setSize(window.innerWidth, window.innerHeight, false);
      if (!on) {
        flushRenderImmediate();
        renderer.shadowMap.needsUpdate = true;
        ghost.visible = false;
        downAt = null;
        roadDragLast = null;
      }
    };
'''
          if old_build not in s:
            raise SystemExit('bloc buildApplyRef introuvable')
          s = s.replace(old_build, new_build, 1)
          p.write_text(s, encoding='utf-8')

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit

      - name: Enregistrer
        run: |
          rm -f .github/workflows/apply-build-placement-optimization.yml
          rm -f .github/workflows/optimize-build-placement.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/CarWashScene.tsx .github/workflows
          git commit -m "Fluidifie la pose des objets en construction"
          git pull --rebase origin main
          git push origin HEAD:main
