name: TikoWiko Security Guard
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  prevent-sensitive-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Block sensitive files
        shell: bash
        run: |
          set -euo pipefail
          failed=0
          while IFS= read -r file; do
            case "$file" in
              .env|*/.env|.env.local|*/.env.local|.env.production|*/.env.production|*.jks|*.keystore|*.p12|*.pfx) echo "::error file=$file::Sensitive file must not be committed."; failed=1;;
            esac
          done < <(git ls-files)
          if [ "$failed" -ne 0 ]; then exit 1; fi
          echo "Security check passed."
# Never store a user password/PIN in source code. Use a derived hash or secure auth service.
