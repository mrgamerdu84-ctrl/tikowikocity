name: Apply mobile dashboard and build camera mode

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/final-mobile-dashboard.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebase on latest main
        run: git pull --rebase origin main

      - name: Patch game UI and mobile build controls
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('src/components/CarWashScene.tsx')
          s = p.read_text()

          def once(old, new):
              global s
              if new in s:
                  return
              if old in s:
                  s = s.replace(old, new, 1)

          once('import { useServerFn } from "@tanstack/react-start";\n', '')
          once(
              'import { RentalManager } from "@/components/RentalManager";\n',
              'import { RentalManager } from "@/components/RentalManager";\nimport { GameDashboard } from "@/components/GameDashboard";\n',
          )
          once(
              '  const [buildMode, setBuildMode] = useState(false);\n  const [tool, setTool] = useState<BuildTool>("straight");',
              '  const [buildMode, setBuildMode] = useState(false);\n  const [buildCameraMode, setBuildCameraMode] = useState(false);\n  const [tool, setTool] = useState<BuildTool>("straight");',
          )
          once(
              '  const buildRef = useRef(false);\n  const toolRef = useRef<BuildTool>("straight");\n  const rotRef = useRef(0);\n  const buildApplyRef = useRef<(on: boolean) => void>(() => {});',
              '  const buildRef = useRef(false);\n  const buildCameraRef = useRef(false);\n  const toolRef = useRef<BuildTool>("straight");\n  const rotRef = useRef(0);\n  const buildApplyRef = useRef<(on: boolean) => void>(() => {});\n  const buildCameraApplyRef = useRef<(on: boolean) => void>(() => {});',
          )

          old_toggle = '''  const toggleBuild = () => {\n    setBuildMode((prev) => {\n      const next = !prev;\n      buildRef.current = next;\n      buildApplyRef.current(next);\n      return next;\n    });\n  };'''
          new_toggle = '''  const toggleBuildCamera = () => {\n    const next = !buildCameraRef.current;\n    buildCameraRef.current = next;\n    setBuildCameraMode(next);\n    buildCameraApplyRef.current(next);\n  };\n  const toggleBuild = () => {\n    setBuildMode((prev) => {\n      const next = !prev;\n      buildRef.current = next;\n      if (!next) {\n        buildCameraRef.current = false;\n        setBuildCameraMode(false);\n      }\n      buildApplyRef.current(next);\n      return next;\n    });\n  };'''
          once(old_toggle, new_toggle)

          once(
              '  const saveFn = useServerFn(saveToDrive);\n  const loadFn = useServerFn(loadFromDrive);',
              '  const saveFn = saveToDrive;\n  const loadFn = loadFromDrive;',
          )
          once(
              '    const onPointerMove = (ev: PointerEvent) => {\n      if (!buildRef.current) {',
              '    const onPointerMove = (ev: PointerEvent) => {\n      if (!buildRef.current || buildCameraRef.current) {',
          )
          once(
              '    const onPointerDown = (ev: PointerEvent) => {\n      if (!buildRef.current) return;',
              '    const onPointerDown = (ev: PointerEvent) => {\n      if (!buildRef.current || buildCameraRef.current) return;',
          )

          old_apply = '''    buildApplyRef.current = (on: boolean) => {\n      gridHelper.visible = on;\n      controls.enabled = !on;\n      renderer.domElement.style.touchAction = on ? "none" : "auto";\n      if (!on) {\n        ghost.visible = false;\n        downAt = null;\n        roadDragLast = null;\n      }\n    };'''
          new_apply = '''    buildApplyRef.current = (on: boolean) => {\n      gridHelper.visible = on;\n      controls.enabled = !on || buildCameraRef.current;\n      renderer.domElement.style.touchAction = on ? "none" : "auto";\n      if (!on) {\n        ghost.visible = false;\n        downAt = null;\n        roadDragLast = null;\n      }\n    };\n    buildCameraApplyRef.current = (cameraMode: boolean) => {\n      if (!buildRef.current) return;\n      controls.enabled = cameraMode;\n      ghost.visible = false;\n      downAt = null;\n      roadDragLast = null;\n      renderer.domElement.style.touchAction = "none";\n    };'''
          once(old_apply, new_apply)

          if '<GameDashboard' not in s:
              m = re.search(r'(      <RentalManager[\s\S]*?\n      />\n)', s)
              if m:
                  dashboard = '''      <GameDashboard\n        hidden={buildMode}\n        player={player ?? null}\n        money={economy.money}\n        washes={economy.washes}\n        residents={residents}\n        houses={city.houses}\n        capacity={city.capacity}\n        machines={machines}\n        cinema={cinema}\n        onBuild={toggleBuild}\n        onShop={() => setShopOpen(true)}\n        onHistory={() => setHistoryOpen(true)}\n        onToggleMachine={toggleMachine}\n        onCinema={() => cinemaRef.current()}\n      />\n'''
                  s = s[:m.end()] + dashboard + s[m.end():]

          # Hide the old scattered dashboard pieces when their exact markers exist.
          for old, new in [
              ('className={`fixed left-2 top-2 z-40 max-w', 'className={`hidden fixed left-2 top-2 z-40 max-w'),
              ('className={`fixed right-2 top-2 z-40 w-[132px]', 'className={`hidden fixed right-2 top-2 z-40 w-[132px]'),
              ('className={`fixed bottom-4 right-4 z-30 flex', 'className={`hidden fixed bottom-4 right-4 z-30 flex'),
              ('className="fixed bottom-4 left-1/2 z-40 -translate-x-1/2"', 'className="hidden fixed bottom-4 left-1/2 z-40 -translate-x-1/2"'),
          ]:
              if old in s and new not in s:
                  s = s.replace(old, new, 1)

          if '🧱 Reprendre la pose' not in s:
              shell = '          <div className="mx-auto flex w-[min(100vw,900px)] flex-col gap-1.5 px-2">\n'
              if shell in s:
                  row = shell + '''            <div className="flex items-center gap-2 rounded-2xl bg-slate-100 p-1.5 ring-1 ring-slate-200">\n              <button\n                type="button"\n                onClick={toggleBuildCamera}\n                aria-pressed={buildCameraMode}\n                className={`flex-1 rounded-xl px-3 py-2 text-[12px] font-extrabold transition-colors ${\n                  buildCameraMode ? "bg-slate-900 text-white" : "bg-white text-slate-900 shadow-sm"\n                }`}\n              >\n                {buildCameraMode ? "🧱 Reprendre la pose" : "✋ Déplacer / zoomer"}\n              </button>\n              <span className="hidden flex-1 text-[11px] font-semibold text-slate-600 sm:block">\n                {buildCameraMode ? "1 doigt = tourner · 2 doigts = déplacer/zoomer" : "Glisse sur la grille pour poser en continu"}\n              </span>\n            </div>\n'''
                  s = s.replace(shell, row, 1)

          p.write_text(s)

          rp = Path('src/components/RentalManager.tsx')
          r = rp.read_text()
          event_block = '''\n  useEffect(() => {\n    const openFromDashboard = () => setOpen(true);\n    window.addEventListener("tikowiko:rentals-open", openFromDashboard);\n    return () => window.removeEventListener("tikowiko:rentals-open", openFromDashboard);\n  }, []);\n'''
          marker = '  const [open, setOpen] = useState(false);\n'
          if 'tikowiko:rentals-open' not in r and marker in r:
              r = r.replace(marker, marker + event_block, 1)
          old_button = 'className="fixed bottom-16 right-3 z-[65] rounded-full bg-white/90 px-3 py-2 text-[12px] font-extrabold text-slate-900 shadow-lg ring-1 ring-slate-900/10 backdrop-blur sm:bottom-16 sm:right-4"'
          if old_button in r:
              r = r.replace(old_button, 'className="hidden"', 1)
          rp.write_text(r)
          PY

      - name: Commit patch
        run: |
          set -euo pipefail
          rm .github/workflows/final-mobile-dashboard.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/CarWashScene.tsx src/components/RentalManager.tsx .github/workflows/final-mobile-dashboard.yml
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Branche le nouveau tableau et le mode caméra mobile"
          git pull --rebase origin main
          git push origin HEAD:main
