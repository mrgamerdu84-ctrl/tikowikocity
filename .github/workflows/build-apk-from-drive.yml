name: Build TikowikoCarWash APK from Drive

on:
  push:
    branches:
      - android-apk-drive-build
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35
        run: yes | sdkmanager "platforms;android-35" "build-tools;35.0.0" >/dev/null

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Create Android wrapper
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/android-drive-wrapper"
          mkdir -p "$ROOT/app/src/main/java/com/tikowiko/carwash"
          mkdir -p "$ROOT/app/src/main/assets"

          cat > "$ROOT/settings.gradle" <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = 'TikowikoCarWash'
          include ':app'
          EOF

          cat > "$ROOT/build.gradle" <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > "$ROOT/app/build.gradle" <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.tikowiko.carwash'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.tikowiko.carwash'
                  minSdk 24
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
          }
          EOF

          cat > "$ROOT/app/src/main/AndroidManifest.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:allowBackup="true"
                  android:hardwareAccelerated="true"
                  android:label="TikowikoCarWash"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:configChanges="keyboardHidden|orientation|screenSize|uiMode"
                      android:exported="true"
                      android:screenOrientation="landscape">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > "$ROOT/app/src/main/java/com/tikowiko/carwash/MainActivity.java" <<'EOF'
          package com.tikowiko.carwash;

          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
              private WebView webView;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  webView = new WebView(this);
                  setContentView(webView);

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);
                  settings.setMediaPlaybackRequiresUserGesture(false);
                  settings.setBuiltInZoomControls(false);
                  settings.setDisplayZoomControls(false);

                  webView.setWebViewClient(new WebViewClient());
                  webView.setWebChromeClient(new WebChromeClient());
                  webView.loadUrl("file:///android_asset/index.html");
              }

              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

      - name: Download game HTML from Google Drive
        shell: bash
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/android-drive-wrapper/app/src/main/assets/index.html"
          FILE_ID="1GX1OxJaBcFrt1pW7_lBjjAxSixm78D6E"
          curl -L --fail --retry 4 --retry-delay 2 \
            "https://drive.usercontent.google.com/download?id=${FILE_ID}&export=download&confirm=t" \
            -o "$OUT" || \
          curl -L --fail --retry 4 --retry-delay 2 \
            "https://drive.google.com/uc?export=download&id=${FILE_ID}" \
            -o "$OUT"
          test -s "$OUT"
          SIZE=$(wc -c < "$OUT")
          echo "Downloaded HTML size: $SIZE bytes"
          test "$SIZE" -gt 1000000
          grep -qi '<!DOCTYPE html' "$OUT"

      - name: Build debug APK
        working-directory: android-drive-wrapper
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Prepare APK
        run: |
          mkdir -p "$GITHUB_WORKSPACE/apk-output"
          cp "$GITHUB_WORKSPACE/android-drive-wrapper/app/build/outputs/apk/debug/app-debug.apk" \
             "$GITHUB_WORKSPACE/apk-output/TikowikoCarWash.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TikowikoCarWash-APK
          path: apk-output/TikowikoCarWash.apk
          if-no-files-found: error
          retention-days: 30
