# trigger: second push so GitHub recognizes the newly-created workflow
name: Apply automatic city growth

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-auto-city-growth.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Integrate automatic city construction
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/components/CarWashScene.tsx')
          s = path.read_text()

          import_anchor = 'import { HOUSE_LEVELS, MAX_HOUSE_LEVEL, houseDef, totalCapacity } from "@/game/houses";\nimport { readLocalCity, saveLocalCity } from "@/game/save";'
          import_repl = 'import { HOUSE_LEVELS, MAX_HOUSE_LEVEL, houseDef, totalCapacity } from "@/game/houses";\nimport { AUTO_CITY_STAGES, type AutoCityStage } from "@/game/autoCityGrowth";\nimport { readLocalCity, saveLocalCity } from "@/game/save";'
          if import_anchor not in s:
              raise SystemExit('Auto-city import anchor not found')
          s = s.replace(import_anchor, import_repl, 1)

          anchor = '''    let ti = 0;
    const spawnNetCar = (cx: number, cz: number) => {'''
          if anchor not in s:
              raise SystemExit('Auto-city insertion anchor not found')

          block = r'''    /* ---------- Croissance automatique de TikowikoCity ----------
       La richesse débloque des chantiers municipaux sans retirer l'argent du joueur.
       Chaque chantier est visible avant que la route, la maison ou le parc soit validé. */
    const autoConstructionGroup = new THREE.Group();
    scene.add(autoConstructionGroup);
    let autoCityBusy = false;

    const autoStageCell = (stage: AutoCityStage) => [MAIN_CX + stage.dx, stage.cz] as const;
    const autoStageResolved = (stage: AutoCityStage) => {
      const [cx, cz] = autoStageCell(stage);
      const road = plan.has(cx, cz);
      const house = Boolean(plan.house(cx, cz));
      const decor = Boolean(plan.decorAt(cx, cz));
      if (stage.kind === "road") return road || house || decor;
      if (stage.kind === "house") return house || road || decor;
      return decor || road || house;
    };

    const makeConstructionSite = (stage: AutoCityStage, cx: number, cz: number) => {
      const site = new THREE.Group();
      site.position.set(cx * TILE, 0.02, cz * TILE);
      autoConstructionGroup.add(site);

      const ground = new THREE.Mesh(
        new THREE.BoxGeometry(TILE * 0.9, 0.12, TILE * 0.9),
        new THREE.MeshStandardMaterial({ color: 0xc7a56a, roughness: 1 }),
      );
      ground.position.y = 0.06;
      ground.receiveShadow = true;
      site.add(ground);

      const poleMat = new THREE.MeshStandardMaterial({ color: 0xe0a326, roughness: 0.72 });
      const beamMat = new THREE.MeshStandardMaterial({ color: 0xf2c44f, roughness: 0.65 });
      const scaffold = new THREE.Group();
      const poleGeo = new THREE.BoxGeometry(0.12, 4.4, 0.12);
      for (const sx of [-2.2, 2.2]) {
        for (const sz of [-2.2, 2.2]) {
          const pole = new THREE.Mesh(poleGeo, poleMat);
          pole.position.set(sx, 2.2, sz);
          scaffold.add(pole);
        }
      }
      for (const y of [1.1, 2.3, 3.5]) {
        const bx = new THREE.Mesh(new THREE.BoxGeometry(4.6, 0.1, 0.1), beamMat);
        bx.position.set(0, y, 2.2);
        const bz = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.1, 4.6), beamMat);
        bz.position.set(2.2, y, 0);
        scaffold.add(bx, bz);
      }
      scaffold.scale.y = 0.04;
      site.add(scaffold);

      const crane = new THREE.Group();
      const mast = new THREE.Mesh(new THREE.BoxGeometry(0.2, 5.5, 0.2), poleMat);
      mast.position.y = 2.75;
      const arm = new THREE.Mesh(new THREE.BoxGeometry(4.6, 0.16, 0.16), beamMat);
      arm.position.set(1.9, 5.35, 0);
      crane.add(mast, arm);
      crane.position.set(-2.4, 0, -2.35);
      crane.visible = stage.kind === "house";
      site.add(crane);

      let preview: THREE.Object3D | null = null;
      if (stage.kind === "house") {
        preview = makeHouse(stage.level ?? 1);
        preview.scale.set(1.55, 0.02, 1.55);
        site.add(preview);
      } else if (stage.kind === "road") {
        preview = new THREE.Mesh(
          new THREE.BoxGeometry(TILE * 0.96, 0.08, TILE * 0.96),
          new THREE.MeshStandardMaterial({ color: 0x697078, roughness: 0.94 }),
        );
        preview.position.y = 0.13;
        preview.scale.x = 0.03;
        site.add(preview);
      } else {
        const color = stage.kind === "park" ? 0x69b85d : 0x646b72;
        preview = new THREE.Mesh(
          new THREE.BoxGeometry(TILE * 0.9, 0.1, TILE * 0.9),
          new THREE.MeshStandardMaterial({ color, roughness: 0.95 }),
        );
        preview.position.y = 0.14;
        preview.scale.set(0.04, 1, 0.04);
        site.add(preview);
      }

      setShadow(site);
      return { site, scaffold, crane, preview };
    };

    const finishAutoStage = (stage: AutoCityStage, cx: number, cz: number) => {
      if (stage.kind === "road") {
        plan.place(cx, cz, "straight", stage.rot ?? 0);
        renderPlan();
      } else if (stage.kind === "house") {
        if (plan.canPlaceHouse(cx, cz)) {
          plan.placeHouse(cx, cz, stage.level ?? 1, stage.rot ?? 0);
          renderHouses();
        }
      } else {
        if (plan.canPlaceDecor(cx, cz)) {
          plan.placeDecor(cx, cz, stage.kind, stage.rot ?? 0);
          renderDecor();
        }
      }
      logRef.current(
        makeEvent("build", `Ville automatique · ${stage.label}`, 0, economyRef.current.money),
      );
      toast.success(`🏗️ ${stage.label} terminé`, {
        description: "TikowikoCity s'agrandit automatiquement grâce à tes revenus.",
      });
    };

    const startAutoStage = (stage: AutoCityStage) => {
      const [cx, cz] = autoStageCell(stage);
      if (stage.kind === "road" && (plan.house(cx, cz) || plan.decorAt(cx, cz))) return false;
      if (stage.kind === "house" && !plan.canPlaceHouse(cx, cz)) return false;
      if ((stage.kind === "park" || stage.kind === "parking") && !plan.canPlaceDecor(cx, cz)) return false;

      autoCityBusy = true;
      const { site, scaffold, crane, preview } = makeConstructionSite(stage, cx, cz);
      const started = performance.now();
      const duration = stage.kind === "house" ? 4200 : stage.kind === "road" ? 2400 : 3000;
      toast.info(`🚧 Chantier : ${stage.label}`, {
        description: `Débloqué à ${stage.unlockMoney.toLocaleString("fr-FR")} € de prospérité.`,
      });

      const tick = (now: number) => {
        if (disposed) {
          autoConstructionGroup.remove(site);
          return;
        }
        const p = Math.min(1, (now - started) / duration);
        const eased = 1 - Math.pow(1 - p, 3);
        scaffold.scale.y = Math.max(0.04, eased);
        crane.rotation.y = now * 0.00065;
        if (preview) {
          if (stage.kind === "house") preview.scale.set(1.55, Math.max(0.02, eased * 1.55), 1.55);
          else if (stage.kind === "road") preview.scale.x = Math.max(0.03, eased);
          else preview.scale.set(Math.max(0.04, eased), 1, Math.max(0.04, eased));
        }
        site.position.y = Math.sin(now * 0.008) * 0.015;
        if (p < 1) {
          requestAnimationFrame(tick);
          return;
        }
        autoConstructionGroup.remove(site);
        finishAutoStage(stage, cx, cz);
        autoCityBusy = false;
      };
      requestAnimationFrame(tick);
      return true;
    };

    const advanceAutoCity = () => {
      if (disposed || autoCityBusy || !plan.has(MAIN_CX, MAIN_CZ_START)) return;
      const wealth = economyRef.current.money;
      const next = AUTO_CITY_STAGES.find(
        (stage) => wealth >= stage.unlockMoney && !autoStageResolved(stage),
      );
      if (next) startAutoStage(next);
    };

    const autoCityLoop = () => {
      if (disposed) return;
      advanceAutoCity();
      window.setTimeout(autoCityLoop, autoCityBusy ? 900 : 1800);
    };
    window.setTimeout(autoCityLoop, 1400);

'''
          s = s.replace(anchor, block + anchor, 1)
          path.write_text(s)
          PY

      - name: Check TypeScript
        run: bunx tsc --noEmit

      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/apply-auto-city-growth.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/CarWashScene.tsx .github/workflows/apply-auto-city-growth.yml
          git commit -m "Ajoute la construction automatique de TikowikoCity"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
