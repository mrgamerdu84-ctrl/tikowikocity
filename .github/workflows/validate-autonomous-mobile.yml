name: Validate autonomous mobile build

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/validate-autonomous-mobile.yml"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Remove obsolete server-only import
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/components/CarWashScene.tsx')
          s = p.read_text()
          s = s.replace('import { useServerFn } from "@tanstack/react-start";\n', '')
          p.write_text(s)
          PY

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate TypeScript and mobile build
        shell: bash
        run: |
          set +e
          : > /tmp/mobile-validation.log
          echo '=== TypeScript ===' >> /tmp/mobile-validation.log
          bunx tsc --noEmit >> /tmp/mobile-validation.log 2>&1
          TS=$?
          echo '=== Vite mobile ===' >> /tmp/mobile-validation.log
          bun run build:mobile >> /tmp/mobile-validation.log 2>&1
          BUILD=$?
          echo "TS=$TS BUILD=$BUILD" >> /tmp/mobile-validation.log
          if [ "$TS" -ne 0 ] || [ "$BUILD" -ne 0 ]; then
            cp /tmp/mobile-validation.log mobile-build-error.txt
            exit 0
          fi

      - name: Commit validation result
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/validate-autonomous-mobile.yml
          if [ -f mobile-build-error.txt ]; then
            git add mobile-build-error.txt .github/workflows/validate-autonomous-mobile.yml
            git commit -m "Diagnostic build mobile autonome"
          else
            git add src/components/CarWashScene.tsx .github/workflows/validate-autonomous-mobile.yml
            git commit -m "Valide TypeScript et build mobile autonome"
          fi
          git pull --rebase origin main
          git push origin HEAD:main
